<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>メモ帳 - 無題</title>
  
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon32.png">
  <link rel="icon" type="image/png" sizes="96x96" href="favicon96.png">
  
  <style>
    :root { --ui-font-size: 13px; }

    body { margin: 0; display: flex; flex-direction: column; height: 100vh; font-family: 'Segoe UI', Meiryo, sans-serif; overflow: hidden; background: #fff; }
    
    /* タブバー */
    .tab-bar {
      display: flex; background: #e8eaed; 
      padding: max(5px, env(titlebar-area-y, 5px)) env(titlebar-area-right, 5px) 0 max(5px, env(titlebar-area-x, 5px));
      box-shadow: inset 0 -1px 0 0 #ccc;
      align-items: flex-end; overflow-x: auto; overflow-y: hidden; user-select: none;
      -webkit-app-region: drag;
      transition: background-color 0.15s, box-shadow 0.15s;
    }
    .tab-bar::-webkit-scrollbar { height: 4px; -webkit-app-region: no-drag; }
    .tab-bar::-webkit-scrollbar-thumb { background: #bbb; border-radius: 4px; }
    
    /* ★ 余白ドラッグホバー時の青い背景 ★ */
    .tab-bar.drag-over-empty {
      background-color: #d0e3f5 !important;
      box-shadow: inset 0 0 8px rgba(0, 103, 192, 0.25), inset 0 -1px 0 0 #ccc !important;
    }
    
    .tab {
      position: relative;
      display: flex; align-items: center; justify-content: space-between;
      min-width: 100px; max-width: 250px; 
      padding: 6px 10px 7px 10px; margin-right: 2px;
      background: #f3f3f3; 
      border: 1px solid transparent; border-bottom: none;
      border-radius: 6px 6px 0 0; font-size: var(--ui-font-size); color: #555; cursor: default;
      transition: background 0.2s; white-space: nowrap; overflow: hidden;
      -webkit-app-region: no-drag;
    }
    .tab:hover { background: #e0e0e0; }
    
    .tab.selected { background: #e3f2fd; color: #005a9e; }
    .tab.active { background: #fff; color: #000; border-color: #ccc; border-bottom: none; box-shadow: 0 1px 0 0 #fff; z-index: 2; }

    .tab.drag-over-left::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: #0067c0; z-index: 10; }
    .tab.drag-over-right::after { content: ""; position: absolute; right: 0; top: 0; bottom: 0; width: 3px; background: #0067c0; z-index: 10; }

    .tab-title { flex: 1; overflow: hidden; text-overflow: ellipsis; pointer-events: none; }
    .tab-close { margin-left: 8px; width: 16px; height: 16px; display: flex; align-items: center; justify-content: center; border-radius: 50%; font-size: 14px; font-weight: bold; cursor: pointer; color: #777; }
    .tab-close:hover { background: #ccc; color: #000; }
    
    .add-tab-btn { width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; margin-left: 5px; margin-bottom: 2px; border-radius: 4px; cursor: pointer; font-size: 18px; color: #555; -webkit-app-region: no-drag; }
    .add-tab-btn:hover { background: #d0d0d0; }

    /* メニューバー */
    .menu-bar { background: #fff; display: flex; font-size: var(--ui-font-size); border-bottom: 1px solid #eee; user-select: none; position: relative; z-index: 1000; padding: 2px 5px; }
    .menu-container { position: relative; }
    .menu-item-btn { padding: 6px 12px; cursor: default; border-radius: 4px; }
    .menu-item-btn:hover, .menu-item-btn.active { background: #f0f0f0; }
    
    .dropdown { display: none; position: absolute; top: 100%; left: 0; background: #fff; border: 1px solid #ccc; border-radius: 6px; box-shadow: 0 4px 15px rgba(0,0,0,0.15); min-width: 250px; padding: 4px 0; }
    .dropdown.show { display: block; }
    .dropdown-item { padding: 6px 15px 6px 25px; display: flex; justify-content: space-between; align-items: center; cursor: default; position: relative; white-space: nowrap; font-size: var(--ui-font-size); color: #333; }
    .dropdown-item:hover { background: #f0f0f0; }
    .dropdown-divider { height: 1px; background: #eee; margin: 4px 0; }
    .shortcut { color: #888; margin-left: 30px; font-size: 11px; pointer-events: none; }
    
    .has-submenu::after { content: "▶"; position: absolute; right: 10px; font-size: 9px; top: 9px; color: #888; }
    .submenu { display: none; position: absolute; top: 0; left: 100%; background: #fff; border: 1px solid #ccc; border-radius: 6px; box-shadow: 0 4px 15px rgba(0,0,0,0.15); min-width: 180px; padding: 4px 0; margin-left: 2px; }
    .dropdown-item:hover > .submenu { display: block; }
    .dropdown-item.disabled { color: #aaa; pointer-events: none; }
    .dropdown-item.disabled .shortcut { color: #ccc; }

    #editor { flex: 1; width: 100%; min-height: 0; position: relative; }
    
    .status-bar { background: #f9f9f9; border-top: 1px solid #ddd; padding: 4px 15px; font-size: var(--ui-font-size); display: flex; justify-content: space-between; color: #555; user-select: none; }
    .status-left { display: flex; align-items: center; gap: 15px; }
    .status-right { display: flex; align-items: center; }
    .status-divider { width: 1px; height: 12px; background: #ccc; margin: 0 15px; }
    
    .clickable-status { cursor: pointer; color: #333; }
    .clickable-status:hover { text-decoration: underline; }
    
    #fileInputFallback { display: none; }

    /* モーダル・ダイアログ全般 */
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.4); z-index: 2400; justify-content: center; align-items: center; }
    .modal-content { background: #fff; border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.2); padding: 20px 30px; min-width: 320px; font-size: var(--ui-font-size); font-family: 'Segoe UI', Meiryo, sans-serif; }
    .modal-buttons { text-align: right; margin-top: 25px; display: flex; justify-content: flex-end; gap: 10px; }
    .modal-buttons button { padding: 6px 24px; font-size: var(--ui-font-size); cursor: pointer; background: #e5e5e5; border: 1px solid #ccc; border-radius: 4px; color: #000; }
    .modal-buttons button.primary { background: #0067c0; color: #fff; border-color: #005a9e; }
    .modal-buttons button:hover { background: #d5d5d5; }

    /* Windows標準のメモ帳風「検索・置換」ダイアログ */
    .win-dialog {
      display: none; position: fixed; background: #f0f0f0; border: 1px solid #666;
      box-shadow: 3px 3px 10px rgba(0,0,0,0.3); z-index: 2500; font-size: 12px;
      font-family: 'MS UI Gothic', 'Meiryo', sans-serif; padding: 12px 15px; color: #000;
      user-select: none; width: 440px; border-radius: 2px; box-sizing: border-box;
    }
    .win-dialog-header { display: flex; justify-content: space-between; margin-bottom: 12px; cursor: move; font-weight: bold; }
    .win-dialog-close { cursor: pointer; padding: 0 4px; font-size: 14px; }
    .win-dialog-content { display: flex; gap: 15px; }
    .win-dialog-left { flex: 1; display: flex; flex-direction: column; justify-content: space-between; gap: 8px; }
    .win-dialog-row { display: flex; align-items: center; gap: 8px; width: 100%; }
    .win-dialog-label { width: 120px; min-width: 120px; white-space: nowrap; display: inline-block; text-align: left; }
    .win-dialog-input { flex: 1; padding: 3px 5px; border: 1px solid #7a7a7a; font-size: 12px; background: #fff; color: #000; outline: none; box-sizing: border-box; width: 100%; }
    .win-dialog-input:focus { border-color: #0078d7; }
    .win-dialog-right { display: flex; flex-direction: column; gap: 6px; width: 100px; min-width: 100px; }
    .win-dialog-btn { padding: 4px 0; font-size: 12px; background: #e1e1e1; border: 1px solid #adadad; text-align: center; cursor: default; border-radius: 2px; box-sizing: border-box; width: 100%; }
    .win-dialog-btn:hover { background: #e5f1fb; border-color: #0078d7; }
    .win-dialog-group { border: 1px solid #d0d0d0; padding: 8px 10px; position: relative; margin-top: 5px; display: flex; gap: 10px;}
    .win-dialog-group-title { position: absolute; top: -8px; left: 8px; background: #f0f0f0; padding: 0 4px; font-size: 11px; color: #444; }

    @media print {
      body, html { height: auto; overflow: visible; background: #fff; }
      .tab-bar, .menu-bar, .status-bar, #editor, .modal-overlay, .win-dialog { display: none !important; }
      #print-area { display: block !important; font-family: 'Segoe UI', Meiryo, monospace; font-size: 11pt; color: #000; white-space: pre-wrap; word-wrap: break-word; }
    }
    #print-area { display: none; }
  </style>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.32.2/ace.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.32.2/ext-language_tools.min.js"></script>
  <script src="https://unpkg.com/encoding-japanese@2.0.0/encoding.min.js"></script>
</head>
<body>

  <div id="aboutModal" class="modal-overlay">
    <div class="modal-content">
      <h3>バージョン情報</h3>
      <p>ブラウザ上で動くメモ帳アプリ（タブ対応版）です。</p>
      <p><a target="_blank" href="https://icons8.com/icon/cHos0K0vg9Ok/notepad">メモ帳</a> icon by <a target="_blank" href="https://icons8.com">Icons8</a></p>
      <div class="modal-buttons"><button onclick="closeModals()">OK</button></div>
    </div>
  </div>

  <div id="installModal" class="modal-overlay">
    <div class="modal-content">
      <h3>アプリのインストール</h3>
      <p>このアプリをパソコンにインストールすると、以下の機能が利用できます。</p>
      <ul style="padding-left: 20px; color: #444;">
        <li>オフライン状態でのアプリの起動と編集</li>
        <li>テキストファイル (.txt, .csv等) のダブルクリック起動</li>
        <li>独立した美しいウィンドウでの表示</li>
      </ul>
      <div class="modal-buttons">
        <button onclick="closeModals()">後で</button>
        <button class="primary" onclick="installApp()">インストールする</button>
      </div>
    </div>
  </div>

  <div id="winDialogOverlay" class="modal-overlay" style="background: rgba(0, 0, 0, 0.15); z-index: 2400;" onclick="closeAllWinDialogs()"></div>

  <div id="winFindDialog" class="win-dialog">
    <div class="win-dialog-header" onmousedown="startDragDialog(event, 'winFindDialog')">
      <span>検索</span>
      <span class="win-dialog-close" onclick="closeAllWinDialogs()">×</span>
    </div>
    <div class="win-dialog-content">
      <div class="win-dialog-left">
        <div class="win-dialog-row">
          <span class="win-dialog-label">検索する文字列(N):</span>
          <input type="text" id="winFindInput" class="win-dialog-input">
        </div>
        <div style="display: flex; align-items: flex-end; justify-content: space-between; margin-top: 12px;">
          <label style="margin-bottom: 5px; white-space: nowrap;"><input type="checkbox" id="winFindMatchCase"> 大文字と小文字を区別する(C)</label>
          <div class="win-dialog-group">
            <span class="win-dialog-group-title">検索方向</span>
            <label style="white-space: nowrap;"><input type="radio" name="winFindDir" value="up"> 上へ(U)</label>
            <label style="white-space: nowrap;"><input type="radio" name="winFindDir" value="down" checked> 下へ(D)</label>
          </div>
        </div>
      </div>
      <div class="win-dialog-right">
        <div class="win-dialog-btn" onclick="execWinFind()">次を検索(F)</div>
        <div class="win-dialog-btn" onclick="closeAllWinDialogs()">キャンセル</div>
      </div>
    </div>
  </div>

  <div id="winReplaceDialog" class="win-dialog">
    <div class="win-dialog-header" onmousedown="startDragDialog(event, 'winReplaceDialog')">
      <span>置換</span>
      <span class="win-dialog-close" onclick="closeAllWinDialogs()">×</span>
    </div>
    <div class="win-dialog-content">
      <div class="win-dialog-left">
        <div class="win-dialog-row">
          <span class="win-dialog-label">検索する文字列(N):</span>
          <input type="text" id="winReplaceFindInput" class="win-dialog-input">
        </div>
        <div class="win-dialog-row">
          <span class="win-dialog-label">置換後の文字列(P):</span>
          <input type="text" id="winReplaceWithInput" class="win-dialog-input">
        </div>
